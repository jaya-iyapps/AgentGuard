services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AG_ENV: development
      AG_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AG_OPA_URL: http://opa:8181
      AG_OPA_DECISION_PATH: ${AG_OPA_DECISION_PATH:-agentguard/authz/decision}
      AG_OPA_TIMEOUT_SECONDS: ${AG_OPA_TIMEOUT_SECONDS:-1.0}
      AG_OPA_POLICY_VERSION: ${AG_OPA_POLICY_VERSION:-pdp-v1}
      AG_PDP_DECISION_TTL_SECONDS: ${AG_PDP_DECISION_TTL_SECONDS:-5}
      AG_PDP_CONTEXT_PATH: ${AG_PDP_CONTEXT_PATH:-}
      AG_PDP_CONTEXT_BACKEND: ${AG_PDP_CONTEXT_BACKEND:-file}
      AG_DATABASE_URL: ${AG_DATABASE_URL:-}
      AG_DATABASE_TIMEOUT_SECONDS: "3"
    volumes:
      - ./.runtime/pdp-config:/app/.runtime/pdp-config:ro
    depends_on:
      opa:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  opa:
    image: openpolicyagent/opa:1.6.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/authorize.rego"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./services/policy-engine/policies:/policies:ro
  postgres:
    profiles: ["database"]
    image: postgres:16
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: ${AG_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pdp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  gateway:
    build: .
    command: ["uvicorn", "agentguard_gateway.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      AG_POLICY_URL: http://backend:8000
      AG_POLICY_CREDENTIAL: ${AG_POLICY_CREDENTIAL:-}
      AG_POLICY_AGENT_ID: ${AG_POLICY_AGENT_ID:-}
      AG_POLICY_ADAPTER_ID: ${AG_POLICY_ADAPTER_ID:-}
      AG_POLICY_VERSION: ${AG_OPA_POLICY_VERSION:-pdp-v1}
      AG_POLICY_TIMEOUT_SECONDS: ${AG_POLICY_TIMEOUT_SECONDS:-2.0}
      # Pass through only when explicitly configured; the archive demo is not a Compose service.
      AG_ARCHIVE_MCP_URL:
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build: apps/dashboard
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      AG_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pdp_postgres_data:
