[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Team development scaffold for AgentGuard / CapabilityGraph"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.14.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "networkx==3.6.1",
  "mcp==1.27.2",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.11.13", "jsonschema==4.26.0"]
postgres = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
where = ["packages/contracts", "services/policy-engine", "services/mcp-gateway"]
include = [
  "agentguard_archive_mcp*",
  "agentguard_contracts*",
  "agentguard_backend*",
  "agentguard_gateway*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services/policy-engine/tests", "services/mcp-gateway/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
