name: Validate scaffold
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/contracts.py --check
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: apps/dashboard
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: apps/dashboard
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
  opa-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          -v "$PWD/services/policy-engine/policies:/policies:ro"
          openpolicyagent/opa:1.6.0 test /policies --verbose
  postgres-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Start disposable PostgreSQL with an ephemeral password
        shell: bash
        run: |
          test_password="$(openssl rand -hex 32)"
          echo "::add-mask::$test_password"
          docker run --detach --name agentguard-postgres --publish 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=agentguard -e POSTGRES_USER=agentguard \
            -e POSTGRES_PASSWORD="$test_password" \
            --health-cmd='pg_isready -U agentguard -d agentguard' \
            --health-interval=2s --health-timeout=3s --health-retries=20 postgres:16
          printf 'AG_TEST_DATABASE_URL=postgresql+psycopg://agentguard:%s@127.0.0.1:5432/agentguard\n' \
            "$test_password" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' agentguard-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs agentguard-postgres
          exit 1
      - run: python -m pytest
      - run: python scripts/contracts.py --check
      - name: Stop disposable database
        if: always()
        run: docker stop agentguard-postgres
